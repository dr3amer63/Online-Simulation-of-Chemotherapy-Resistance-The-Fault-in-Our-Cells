name: Feature or improvement
description: Suggest a change that helps learners or keepers of the lab rules
title: '[idea] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What learner or maintainer need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: dropdown
    id: faithfulness
    attributes:
      label: Lab faithfulness
      description: Does this stay inside the MIT bead-lab rules?
      options:
        - Yes, still matches the lab model
        - Intentional extension (I will document it)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
